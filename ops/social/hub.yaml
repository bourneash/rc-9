# social-hub configuration — rc-9.com
#
# A tool, not a content site — it has no article stream to ingest. The channel
# is managed here so releases and milestones can be posted by hand:
# `social-hub compose rc-9.com bluesky --body "…"`.

enabled: true
platforms: [bluesky, console]

# Existing covers are used first; media-gen supplies image bytes for sources
# that have no cover yet, before the social adapter publishes the post.
media:
  generate_missing: true
  site: rc-9
  backend: comfyui
  profile: fast
  width: 1216
  height: 832
  aspect_ratio: "3:2"

sources:
  collections:
    - name: spotlight
      glob: "ops/social/spotlight/*.md"
      url_template: "{url}"

approval: manual
variants_per_source: 2
max_source_age_hours: 720

cadence:
  per_platform_per_day: 2
  min_gap_minutes: 300
  quiet_hours: [4, 11]
  slots: ["15:25", "20:25"]

reply:
  enabled: true
  approval: manual
  max_per_day: 6

ai:
  model: claude-sonnet-4-6
  guardrails: >-
    Never invent gameplay features, release dates or player numbers. Nothing
    that reads as a real military or emergency communication.

voice: >-
    A remote-command game — terse, in-world, operator-to-operator. Reads like
    a dispatch, not a marketing post.

hashtags: []
link_style: append

platform_overrides:
  console:
    approval: auto
    copy_from: bluesky
    cadence:
      per_platform_per_day: 6
      min_gap_minutes: 30
