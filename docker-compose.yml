# rc-9.com autonomous ops — Docker Compose
#
# Two services:
#   - cron:   long-running supercronic, drives the schedule from ops/docker/crontab.docker
#   - worker: one-shot per role invocation. Spawns fresh, runs the role, exits.
#
# Bring up:    docker compose up -d cron
# Manual run:  docker compose run --rm worker engineer
# Logs:        docker compose logs -f cron
# Tear down:   docker compose down
#
# Cloned from americastrikes.com (leaner: worker + cron only, no news scraper).

name: rc-9-ops

services:
  worker:
    mem_limit: 8g
    pids_limit: 2048
    cap_drop:
      - ALL
    image: fleet-site-worker:latest
    # One-shot — only invoked via `docker compose run --rm worker <role>`.
    profiles: ["manual"]
    security_opt:
      - no-new-privileges:true
    volumes:
      # Project code (writable — roles commit/edit here)
      - .:/work
      # Isolate site deps in a container-managed volume so the Alpine/musl worker
      # installs its OWN node_modules (musl-native) instead of the host's glibc
      # tree. Sharing the host tree breaks npm ci with EACCES on root-owned
      # leftovers (mixed host/container ownership) → partial install → the build
      # gate fails with "vite: not found". entrypoint-worker.sh runs npm ci into
      # this volume; the bin sentinel guarantees a populate on a fresh volume.
      - site_node_modules:/work/site/node_modules
      # Claude Code auth — mount ONLY credentials, not the full ~/.claude.
      - ${HOME}/.claude/.credentials.json:/home/ops/.claude/.credentials.json
      # Cross-container OAuth refresh mutex. Every site bind-mounts the SAME
      # credentials file above, so a refresh in one container rotates the token
      # out from under any other container holding a copy of it -- which the
      # server reads as refresh-token reuse and answers by revoking the whole
      # family (2026-09-01: 22 co-firing promoters + 2 bystanders, all 401).
      # claude-tracked.sh flocks this file across the CLI startup window so only
      # one container at a time reads-and-maybe-rotates the credential.
      - ${HOME}/.claude/.credentials.lock:/home/ops/.claude/.credentials.lock
      - ${HOME}/.claude.json:/home/ops/.claude-host.json:ro
      # Minimal settings: no plugins, no hooks, no status line.
      - ./ops/docker/worker-claude-settings.json:/home/ops/.claude/settings.json:ro
      # Git push via host SSH key (the github-bourneash alias)
      - ${HOME}/.ssh:/home/ops/.ssh:ro
      # Shared CF / affiliate / Slack creds across domain projects
      - ${HOME}/projects/domains/tools/env-broker/rendered/rc-9.com.env:/work/.env.shared:ro
      # Shared monorepo tooling (claude-tracked.sh token-usage wrapper, etc.) —
      # without this, $REPO_ROOT/.monorepo-tools is empty and the fallback
      # ../../tools path doesn't exist inside the container either.
      - ${HOME}/projects/domains/tools:/work/.monorepo-tools:ro
    environment:
      CLOUDFLARE_API_TOKEN: ${CLOUDFLARE_API_TOKEN:-}
      CLOUDFLARE_ACCOUNT_ID: ${CLOUDFLARE_ACCOUNT_ID:-}
      GIT_USER_NAME: "Remote Command Bot"
      GIT_USER_EMAIL: "bot@rc-9.com"
      # Engineer role throttle (tasks worked per run). Default 3.
      ENGINEER_MAX_TASKS: ${ENGINEER_MAX_TASKS:-3}
      GIT_SSH_COMMAND: "ssh -i /home/ops/.ssh/github-bourneash -o StrictHostKeyChecking=accept-new"
    networks: [ops]

  cron:
    mem_limit: 1g
    pids_limit: 512
    cap_drop:
      - ALL
    image: fleet-site-cron:latest
    container_name: rc-9-cron
    restart: unless-stopped
    # Tier-1 liveness. supercronic is PID 1 (entrypoint-cron.sh exec's it), so
    # reading /proc/1/comm is exact, spawns no process, and — unlike the
    # `pgrep -f supercronic` this replaces — CANNOT match the probe itself.
    # That old probe was unfailable: the healthcheck's own shell carried the
    # string "supercronic" in its cmdline, so `pgrep -f` always exited 0 and
    # the container reported healthy even with a dead scheduler.
    #
    # 120s, not 60s: measured cost is ~40ms wall / ~8ms CPU per probe, and the
    # fleet-wide budget rule is no interval below 60s and NO network/docker-CLI
    # inside a container healthcheck. See tools/fleet-images/README.md —
    # autoheal's baked-in 5s probe firing a runc exec every 5s is the incident
    # that rule exists to prevent.
    #
    # This only catches a DEAD supercronic. A WEDGED one still answers here;
    # that is tier 2's job (tools/scripts/cron-freshness-cron.sh), one host-side
    # sweep for the whole fleet rather than 26 more per-container probes.
    healthcheck:
      test: ["CMD", "grep", "-qx", "supercronic", "/proc/1/comm"]
      interval: 120s
      timeout: 5s
      retries: 3
      start_period: 30s
    labels:
      # Docker never restarts a container just for going unhealthy. Without
      # this label the healthcheck above is decoration — vpn-autoheal
      # (tools/vpn-proxy) is what turns unhealthy into a restart.
      autoheal: "true"
    security_opt:
      - no-new-privileges:true
    volumes:
      # Crontab is BIND-MOUNTED, never baked into the image: editing
      # ops/docker/crontab.docker and restarting this container is the whole
      # reschedule procedure. Baking it is what let schedules silently
      # diverge from the repo for days at a time.
      - ./ops/docker/crontab.docker:/etc/crontab.docker:ro
      # Docker socket so this container can invoke `docker compose run`.
      - /var/run/docker.sock:/var/run/docker.sock
      # CRITICAL: bind the host project at the SAME absolute path inside cron so
      # `.` in the worker volume specs resolves consistently host ↔ container.
      - ${PWD:-/home/jesse/projects/domains/sites/rc-9.com}:${PWD:-/home/jesse/projects/domains/sites/rc-9.com}
      # Docker config dir — needed when run-worker.sh rebuilds the worker image.
      - ${HOME:-/home/jesse}/.docker:${HOME:-/home/jesse}/.docker
      # Shared credentials (Slack token, CF vars) — sourced at startup by entrypoint-cron.sh.
      - ${HOME:-/home/jesse}/projects/domains/tools/env-broker/rendered/rc-9.com.env:${PWD:-/home/jesse/projects/domains/sites/rc-9.com}/.env.shared:ro
    working_dir: ${PWD:-/home/jesse/projects/domains/sites/rc-9.com}
    environment:
      SITE_NAME: rc-9.com
      FLEET_WORKER_IMAGE: fleet-site-worker:latest
      TZ: America/New_York
      COMPOSE_PROJECT_NAME: rc-9-ops
      HOME: ${HOME:-/home/jesse}
    networks: [ops]
    depends_on: []

networks:
  ops:
    driver: bridge

volumes:
  # Container-managed musl-native site/node_modules for the worker (see worker
  # volume comment). Persists across runs; entrypoint npm ci populates it once.
  site_node_modules:
